<script>
(function () {
  'use strict';
  var CONTACT = 'Email：chengmu00082998@gmail.com／LINE：@378vuckv／電話：0952-159-801';
  var MAX_HISTORY = 10;   // 與 Worker 的上限一致
  var panel = document.getElementById('panel');
  var fab = document.getElementById('fab');
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('q');
  var sendBtn = document.getElementById('sendBtn');
  var quick = document.getElementById('quick');
  var history = [];       // [{ role: 'user'|'assistant', content }]
  var busy = false;

  function setOpen(open) {
    panel.hidden = !open;
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) input.focus();
  }
  fab.addEventListener('click', function () { setOpen(panel.hidden); });
  document.getElementById('closeBtn').addEventListener('click', function () { setOpen(false); });

  function addBubble(cls, text) {
    var el = document.createElement('div');
    el.className = 'bubble ' + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function setBusy(b) {
    busy = b;
    sendBtn.disabled = b;
    quick.querySelectorAll('button').forEach(function (btn) { btn.disabled = b; });
  }

  // 只送最近的對話，並確保第一則是 user（Worker 要求 user/assistant 交替）
  function recentHistory() {
    var h = history.slice(-MAX_HISTORY);
    if (h.length && h[0].role !== 'user') h = h.slice(1);
    return h;
  }

  function ask(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    quick.hidden = true;   // 問過第一題後收起快速提問，把空間留給對話
    addBubble('user', text);
    history.push({ role: 'user', content: text });
    var wait = addBubble('bot wait', '思考中…');
    setBusy(true);

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: recentHistory() })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, data: data };
      });
    }).then(function (r) {
      wait.remove();
      if (r.ok && r.data.reply) {
        addBubble('bot', r.data.reply);
        history.push({ role: 'assistant', content: r.data.reply });
      } else {
        history.pop();   // 這題沒有成功回覆，從對話紀錄拿掉以維持交替
        addBubble('err', (r.data && r.data.error) || ('服務暫時無法使用，請改用以下方式聯絡：' + CONTACT));
      }
    }).catch(function () {
      wait.remove();
      history.pop();
      addBubble('err', '目前無法連線到服務助理，請改用以下方式聯絡：' + CONTACT);
    }).then(function () {
      setBusy(false);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value;
    input.value = '';
    ask(text);
  });
  quick.addEventListener('click', function (e) {
    if (e.target.tagName === 'BUTTON') ask(e.target.textContent);
  });

  // CAD 十字游標：僅滑鼠裝置；只動 transform、rAF 節流；指標離開視窗淡出
  if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
    var wrap = document.createElement('div');
    wrap.className = 'cad-cursor';
    wrap.setAttribute('aria-hidden', 'true');
    wrap.innerHTML = '<span class="cad-x"></span><span class="cad-y"></span>';
    document.body.appendChild(wrap);
    var vx = wrap.querySelector('.cad-x'), hy = wrap.querySelector('.cad-y');
    var raf = 0, px = 0, py = 0;
    var apply = function () { raf = 0; vx.style.transform = 'translateX(' + px + 'px)'; hy.style.transform = 'translateY(' + py + 'px)'; };
    window.addEventListener('mousemove', function (ev) {
      px = ev.clientX; py = ev.clientY;
      wrap.classList.add('on');
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive: true });
    document.addEventListener('mouseleave', function () { wrap.classList.remove('on'); });
    window.addEventListener('blur', function () { wrap.classList.remove('on'); });
  }
})();
</script>
