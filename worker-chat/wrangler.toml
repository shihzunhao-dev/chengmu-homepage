name = "chengmu-chat"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 掛在官網同網域底下，前端用相對路徑 /api/chat 呼叫，不用處理 CORS
[[routes]]
pattern = "chengmu.com.tw/api/*"
zone_name = "chengmu.com.tw"

# knowledge.md 以純文字打包進 Worker（import KNOWLEDGE from "../knowledge.md"）
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# 軟性限流：每個 IP 每 60 秒最多 10 次；各機房分開計算，屬近似值。
# 真正的花費上限是 Anthropic Console 工作區的每月 50 USD 上限。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 10
  period = 60

# 對話紀錄（D1）：表結構見 schema.sql，匯出用 export-chats.ps1 或 ChengMu-Console.exe
[[d1_databases]]
binding = "DB"
database_name = "chengmu-chat-log"
database_id = "33bab8c1-cd58-48a4-94c6-4754e13fe36f"

# 轉交工程師的通知信（Cloudflare Email Service）：只能寄到這個已驗證的收件地址
# 前置：chengmu.com.tw 啟用 Email Routing，並驗證 chengmu00082998@gmail.com 為 destination address
[[send_email]]
name = "EMAIL"
destination_address = "chengmu00082998@gmail.com"

# 機密：ANTHROPIC_API_KEY 用 `wrangler secret put ANTHROPIC_API_KEY` 設定，不寫在這裡
