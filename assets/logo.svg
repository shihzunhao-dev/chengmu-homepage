    <filter id="cm-shadow" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#cm-shadow)">
    <!-- LEFT  <  : outer edge vertical at x=3, inner (opening) edges vertical at x=50 -->
    <path d="M50,10 L3,34 L3,51 L50,76 L50,57 L24,43 L50,28 Z" fill="#9ec92a"/>
    <path d="M50,10 L3,34 L24,43 L50,28 Z" fill="url(#cm-gLeftU)"/>
    <path d="M3,51 L50,76 L50,57 L24,43 Z" fill="url(#cm-gLeftL)"/>
    <!-- MID  /  : bottom edge horizontal at y=84 -->
    <path d="M101,1 L83,1 L56,84 L75,84 Z" fill="url(#cm-gMid)"/>
    <!-- RIGHT  >  : exact mirror of LEFT about x=78.5, outer edge x=154, inner edges x=107 -->
    <path d="M107,10 L154,34 L154,51 L107,76 L107,57 L133,43 L107,28 Z" fill="#03a5e0"/>
    <path d="M107,10 L154,34 L133,43 L107,28 Z" fill="url(#cm-gRightU)"/>
    <path d="M154,51 L107,76 L107,57 L133,43 Z" fill="url(#cm-gRightL)"/>
  </g>
