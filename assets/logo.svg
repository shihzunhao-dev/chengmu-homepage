<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 88" role="img" aria-labelledby="cm-logo-title cm-logo-desc">
  <title id="cm-logo-title">ChengMu</title>
  <desc id="cm-logo-desc">由 &lt; / &gt; 三個尖括號組成的程式碼意象標誌，左綠、中漸層、右藍（左右鏡像對稱於 x=78.5）</desc>
  <defs>
    <linearGradient id="cm-gMid" gradientUnits="userSpaceOnUse" x1="94" y1="-2" x2="64" y2="87">
      <stop offset="0.00" stop-color="#d2cd49"/>
      <stop offset="0.04" stop-color="#cfcb47"/>
      <stop offset="0.12" stop-color="#c8cb43"/>
      <stop offset="0.21" stop-color="#bdc93d"/>
      <stop offset="0.29" stop-color="#a7bf41"/>
      <stop offset="0.38" stop-color="#7ea752"/>
      <stop offset="0.46" stop-color="#5a9161"/>
      <stop offset="0.54" stop-color="#3a7e6e"/>
      <stop offset="0.62" stop-color="#24727c"/>
      <stop offset="0.71" stop-color="#1d718a"/>
      <stop offset="0.79" stop-color="#187095"/>
      <stop offset="0.88" stop-color="#13709e"/>
      <stop offset="1.00" stop-color="#0f6fa8"/>
    </linearGradient>
    <linearGradient id="cm-gLeftU" gradientUnits="userSpaceOnUse" x1="53" y1="17" x2="3" y2="40">
      <stop offset="0.00" stop-color="#e0f036"/>
      <stop offset="0.06" stop-color="#dcee34"/>
      <stop offset="0.19" stop-color="#cee732"/>
      <stop offset="0.31" stop-color="#c3e231"/>
      <stop offset="0.44" stop-color="#b7dc2f"/>
      <stop offset="0.56" stop-color="#abd52e"/>
      <stop offset="0.69" stop-color="#9eca2d"/>
      <stop offset="0.81" stop-color="#95c22c"/>
      <stop offset="1.00" stop-color="#8cba2b"/>
    </linearGradient>
    <linearGradient id="cm-gLeftL" gradientUnits="userSpaceOnUse" x1="3" y1="45" x2="56" y2="71">
      <stop offset="0.00" stop-color="#639224"/>
      <stop offset="0.06" stop-color="#669426"/>
      <stop offset="0.19" stop-color="#6fa029"/>
      <stop offset="0.31" stop-color="#83b328"/>
      <stop offset="0.44" stop-color="#a6cb1f"/>
      <stop offset="0.56" stop-color="#cadf12"/>
      <stop offset="0.69" stop-color="#f3f706"/>
      <stop offset="0.80" stop-color="#ffff00"/>
      <stop offset="1.00" stop-color="#ffff00"/>
    </linearGradient>
    <linearGradient id="cm-gRightU" gradientUnits="userSpaceOnUse" x1="104" y1="17" x2="154" y2="40">
      <stop offset="0.00" stop-color="#00b8f2"/>
      <stop offset="0.06" stop-color="#00b5ef"/>
      <stop offset="0.19" stop-color="#01abe9"/>
      <stop offset="0.31" stop-color="#01a3e4"/>
      <stop offset="0.44" stop-color="#019fe2"/>
      <stop offset="0.69" stop-color="#009fe0"/>
      <stop offset="0.81" stop-color="#0198d5"/>
      <stop offset="1.00" stop-color="#0676ad"/>
    </linearGradient>
    <linearGradient id="cm-gRightL" gradientUnits="userSpaceOnUse" x1="154" y1="45" x2="101" y2="71">
      <stop offset="0.00" stop-color="#047cab"/>
      <stop offset="0.06" stop-color="#047faf"/>
      <stop offset="0.19" stop-color="#048cbe"/>
      <stop offset="0.31" stop-color="#0394c3"/>
      <stop offset="0.44" stop-color="#03a0cc"/>
